name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, 'feature/*']
  push:
    branches: [main, 'feature/*']
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  ci-pipeline:
    name: CI/CD Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      YARN_CACHE_FOLDER: .yarn-cache
      FORCE_COLOR: '1'
      NODE_ENV: development

    steps:
      - name: 🔧 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 Enable Corepack (for Yarn)
        run: corepack enable

      - name: 🔧 Environment Setup
        run: |
          echo "🔧 Setting up build environment..."
          node --version
          npm --version
          yarn --version
          git --version
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Build: ${{ github.run_number }}"
          echo "Workspace: ${{ github.workspace }}"
          echo ""
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "🔀 Pull Request Build: PR-${{ github.event.pull_request.number }}"
            echo "📝 PR Title: ${{ github.event.pull_request.title }}"
            echo "🎯 Target: ${{ github.event.pull_request.base.ref }}"
          else
            echo "🌿 Branch Build: ${{ github.ref_name }}"
          fi

      - name: 📦 Install Dependencies
        run: |
          echo "📦 Installing dependencies..."
          yarn install

      - name: 🎨 Format Check
        run: |
          echo "🎨 Checking code formatting..."
          yarn format:check
        continue-on-error: false

      - name: 🏗️ Build
        run: |
          echo "🏗️ Building all packages..."
          yarn build
          echo ""
          echo "📋 Checking build outputs..."
          ls -la packages/api/dist || echo "⚠️ packages/api/dist not found"
          ls -la packages/core/dist || echo "⚠️ packages/core/dist not found"
          ls -la packages/infrastructure/fs/dist || echo "⚠️ packages/infrastructure/fs/dist not found"
          ls -la packages/infrastructure/persistence/dist || echo "⚠️ packages/infrastructure/persistence/dist not found"
        continue-on-error: false

      - name: 🔍 Lint
        run: |
          echo "🔍 Running linting checks..."
          yarn lint
        continue-on-error: false

      - name: 🧪 Test
        id: test
        run: |
          echo "🧪 Running tests..."
          yarn turbo run coverage:workspace
        continue-on-error: false

      - name: 📊 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: steps.test.outcome != 'skipped'
        with:
          files: 'packages/*/test-results/merged-results.xml'
          check_name: Test Results
          comment_mode: off

      - name: 📤 Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: steps.test.outcome != 'skipped'
        with:
          name: test-results
          path: |
            packages/*/test-results/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: 📊 Generate Coverage Report
        id: coverage
        if: steps.test.outcome != 'skipped'
        run: |
          echo "📊 Generating Coverage report..."
          yarn turbo run coverage:workspace
        continue-on-error: false

      - name: 📤 Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: steps.coverage.outcome != 'skipped'
        with:
          name: coverage-report
          path: |
            coverage/merged/index.html
            coverage/merged/**/*
          retention-days: 14
          if-no-files-found: warn

      - name: ✅ Pipeline Summary
        if: always()
        run: |
          echo "## 📊 Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment Setup | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Install Dependencies | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ steps.test.outcome == 'success' && '✅' || steps.test.outcome == 'failure' && '❌' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ steps.coverage.outcome == 'success' && '✅' || steps.coverage.outcome == 'failure' && '❌' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "🔀 **PR-${{ github.event.pull_request.number }}**: ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "🌿 **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Full Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          echo "✅ Pipeline completed!"
