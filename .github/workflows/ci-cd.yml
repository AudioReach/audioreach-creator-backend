name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, 'feature/*', 'task/*']
  push:
    branches: [main, 'feature/*', 'task/*']
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  ci-pipeline:
    name: CI/CD Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PNPM_CACHE_FOLDER: .pnpm-cache
      FORCE_COLOR: '1'
      NODE_ENV: development

    steps:
      - name: 🔧 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 Enable Corepack (for pnpm)
        run: corepack enable

      - name: 🔧 Environment Setup
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKSPACE: ${{ github.workspace }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "🔧 Setting up build environment..."
          node --version
          npm --version
          pnpm --version
          git --version
          echo ""
          echo "Branch: $REF_NAME"
          echo "Build: $RUN_NUMBER"
          echo "Workspace: $WORKSPACE"
          echo ""
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "🔀 Pull Request Build: PR-$PR_NUMBER"
            echo "📝 PR Title: $PR_TITLE"
            echo "🎯 Target: $PR_BASE_REF"
          else
            echo "🌿 Branch Build: $REF_NAME"
          fi

      - name: 📦 Install Dependencies
        run: |
          echo "📦 Installing dependencies..."
          pnpm install

      - name: 🎨 Format Check
        run: |
          echo "🎨 Checking code formatting..."
          pnpm format:check
        continue-on-error: false

      - name: 🔍 Lint
        run: |
          echo "🔍 Running linting checks..."
          pnpm lint
        continue-on-error: false

      - name: 🏗️ Build
        run: |
          echo "🏗️ Building all packages..."
          pnpm build
          echo ""
          echo "📋 Checking build outputs..."
          ls -la packages/api/dist || echo "⚠️ packages/api/dist not found"
          ls -la packages/core/dist || echo "⚠️ packages/core/dist not found"
          ls -la packages/infrastructure/fs/dist || echo "⚠️ packages/infrastructure/fs/dist not found"
          ls -la packages/infrastructure/persistence/dist || echo "⚠️ packages/infrastructure/persistence/dist not found"
        continue-on-error: false

      - name: 🧪 Test
        id: test
        run: |
          echo "🧪 Running tests..."
          pnpm turbo run coverage:workspace
        continue-on-error: false

      - name: 📊 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: steps.test.outcome != 'skipped'
        with:
          files: 'packages/*/test-results/merged-results.xml'
          check_name: Test Results
          comment_mode: off

      - name: 📤 Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: steps.test.outcome != 'skipped'
        with:
          name: test-results
          path: |
            packages/*/test-results/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: 📤 Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: steps.test.outcome != 'skipped'
        with:
          name: coverage-report
          path: |
            coverage/merged/index.html
            coverage/merged/**/*
          retention-days: 14
          if-no-files-found: warn

      - name: ✅ Pipeline Summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "## 📊 Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment Setup | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Install Dependencies | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ steps.test.outcome == 'success' && '✅' || steps.test.outcome == 'failure' && '❌' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "🔀 **PR-${PR_NUMBER}**: ${PR_TITLE}" >> $GITHUB_STEP_SUMMARY
          else
            echo "🌿 **Branch**: ${REF_NAME}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Full Logs](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})" >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          echo "✅ Pipeline completed!"
